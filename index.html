<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevFeed</title>
  <meta name="description" content="Top software engineering links in one feed.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DevFeed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <h1>Dev<span>Feed</span></h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
    </div>
    <nav id="chips" class="chips" aria-label="Sources"></nav>
    <p id="offline" class="offline" hidden>You're offline. Showing what was cached.</p>
  </header>
  <main>
    <div id="feed"></div>
    <div id="notices"></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
